# nexxhub: Artemis stream profile for nexxxen (Pi 4 -> Samsung TV 2560x1440@60, Apollo on the PC over 5 GHz Wi-Fi)
# Applied to ~/.config/Artemis Desktop Project/Artemis.conf by artemis-apply-settings.py before Artemis
# starts, but only when this file is newer than the last apply - changes made in the Artemis UI stick otherwise.
[General]
# match the TV mode exactly: no scaling on the Pi, Apollo's virtual display renders at this size
width=2560
height=1440
fps=60
# Wi-Fi limited: the link measured 95 Mbit/s once but 37-47 Mbit/s later, and a 40 Mbps stream lost 9% of
# frames (+6% to jitter). 30 Mbps holds; quality per bit comes from Apollo's "slower" QSV preset instead.
# On Ethernet (eth0) this can go to 60-80 Mbps.
bitrate=30000
autoadjustbitrate=false
# HEVC: Pi 4 has hardware HEVC (V4L2 stateless) but no AV1 and only 1080p H.264
videocfg=2
hdr=true
yuv444=false
# hardware decode only; never fall back to the (far too slow) software decoder
videodec=1
# smooth 60 on a 60 Hz TV
vsync=true
framepacing=true
# HiFiBerry DSP chain is stereo
audiocfg=0
windowmode=0
multicontroller=true
gamepadmouse=true
quitAppAfter=false
# ask Apollo for a per-client virtual display at 2560x1440 (the PC's ultrawide stays untouched)
virtualdisplay=true
fractionalrefreshrate=false
resolutionscaling=false
showperfoverlay=false
keepawake=true
